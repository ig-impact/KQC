url: "https://pkgs.impact-initiatives.org/KQC"
template:
  bootstrap: 5
  light-switch: true
  bslib:
    base_font: {google: "Roboto Condensed"}
    heading_font: {google: "Roboto Condensed"}
    code_font: {google: "JetBrains Mono"}

reference:
- title: "Validation functions"
  contents: 
  - starts_with("rows")
  - starts_with("col")
- title: "Datasets"
  contents:
  - starts_with("msna")
- title: "Shiny"
  contents:
  - starts_with("kqc_")
